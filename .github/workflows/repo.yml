name: Repo

permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/repo.yml
      - mister/config/**
      - mister/generate_repo.py
  push:
    branches: [main]
    paths:
      - .github/workflows/repo.yml
      - mister/config/**
      - mister/generate_repo.py

concurrency:
  group: repo-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Get Latest Release
        uses: pozetroninc/github-action-get-latest-release@5ac6001ed175b443484c81ab32a20e12132be99c # master
        with:
          repository: misteraddons/Reflex-Adapt-Legacy
          excludes: prerelease, draft
        id: updater
      - name: Fetch Reflex Updater
        uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # master
        with:
          repo: misteraddons/Reflex-Adapt-Legacy
          version: tags/${{ steps.updater.outputs.release }}
          file: reflex_updater.sh
      - name: Generate Repo File
        run: python3 ./mister/generate_repo.py "${{ steps.updater.outputs.release }}"
      - name: Commit Repo File
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          add: reflex-adapt-legacy.json.zip
